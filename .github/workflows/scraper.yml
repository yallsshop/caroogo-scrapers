name: Daily Inventory Scraper

on:
  schedule:
    # Run at 3 AM and 3 PM EST (8 AM and 8 PM UTC)
    - cron: '0 8 * * *'
    - cron: '0 20 * * *'
  workflow_dispatch: # Manual trigger from GitHub Actions tab

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install httpx supabase python-dotenv

      - name: Run Inventory Scraper
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          python inventory_scraper.py
